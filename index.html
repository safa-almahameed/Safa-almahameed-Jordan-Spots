<!DOCTYPE html>

<html lang="ar" id="html-tag">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<style>

body{font-family:Arial;margin:0;background:#f5f5f5;}

header{

padding:20px;

text-align:center;

}

input,select{

padding:10px;

margin:5px;

border-radius:8px;

border:1px solid #ccc;

}

.place{

background:white;

margin:10px;

padding:15px;

border-radius:12px;

cursor:pointer;

position:relative;

transition:0.3s;

}

.place:hover{transform:scale(1.02)}

.heart{

position:absolute;

top:10px;

right:10px;

cursor:pointer;

font-size:20px;

}

.rating{

color:gold;

font-size:14px;

margin-top:5px;

}

.toast{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

background:#333;

color:white;

padding:10px 20px;

border-radius:10px;

display:none;

}

</style>

</head>

<body>

<header>

<h2 id="title"></h2>

<input id="search">

<select id="filter"></select>

<button onclick="toggleLang()" id="lang-btn"></button>

</header>

<div id="places"></div>

<div id="toast" class="toast"></div>

<script>

let lang="ar";

const t={

ar:{

title:"المواقع السياحية",

search:"ابحث...",

filter:"فلترة",

lang:"English",

favAdd:"تمت الإضافة للمفضلة ❤️",

favRemove:"تم الحذف 💔"

},

en:{

title:"Tourist Places",

search:"Search...",

filter:"Filter",

lang:"العربية",

favAdd:"Added to favorites ❤️",

favRemove:"Removed 💔"

}

};

const places=[

{n_ar:"مطعم عمان",n_en:"Amman Restaurant",loc_ar:"عمان",loc_en:"Amman",cat:"restaurant"},

{n_ar:"مقهى جميل",n_en:"Nice Cafe",loc_ar:"العبدلي",loc_en:"Abdali",cat:"cafe"}

];

let favorites=JSON.parse(localStorage.getItem("favorites"))||[];

function toast(msg){

const t=document.getElementById("toast");

t.textContent=msg;

t.style.display="block";

setTimeout(()=>t.style.display="none",2000);

}

function render(){

const tr=t[lang];

document.title=tr.title;

document.getElementById("title").textContent=tr.title;

document.getElementById("search").placeholder=tr.search;

document.getElementById("filter").innerHTML=`<option>${tr.filter}</option>`;

document.getElementById("lang-btn").textContent=tr.lang;

document.getElementById("html-tag").dir=lang==="ar"?"rtl":"ltr";

showPlaces(places);

}

function showPlaces(list){

const container=document.getElementById("places");

container.innerHTML="";

list.forEach((p,i)=>{

const fav=favorites.includes(p.n_en);

const div=document.createElement("div");

div.className="place";

div.innerHTML=`

<div class="heart" onclick="toggleFav(event,${i})">

${fav?"❤️":"🤍"}

</div>

<div>${lang==="ar"?p.n_ar:p.n_en}</div>

<div class="rating">⭐⭐⭐⭐☆</div>

`;

div.onclick=()=>openPlace(p);

container.appendChild(div);

});

}

function toggleFav(e,i){

e.stopPropagation();

const place=places[i];

const exists=favorites.includes(place.n_en);

if(exists){

favorites=favorites.filter(f=>f!==place.n_en);

toast(t[lang].favRemove);

}else{

favorites.push(place.n_en);

toast(t[lang].favAdd);

}

localStorage.setItem("favorites",JSON.stringify(favorites));

render();

}

document.getElementById("search").addEventListener("input",function(){

const val=this.value.toLowerCase();

const filtered=places.filter(p=>

(p.n_ar+p.n_en).toLowerCase().includes(val)

);

showPlaces(filtered);

});

function openPlace(p){

const data={

currentLang:lang,

...p,

totalCost:25,

cat:p.cat

};

localStorage.setItem("selectedPlace",JSON.stringify(data));

window.location.href="details.html";

}

function toggleLang(){

lang=lang==="ar"?"en":"ar";

render();

}

render();

</script>

</body>

</html>
