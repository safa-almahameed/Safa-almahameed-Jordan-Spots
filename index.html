<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Spots | safa/deemah</title>
    <style>
        :root { --primary: #667eea; --secondary: #764ba2; --bg: #f8f9fa; --text: #2d3436; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg); color: var(--text); transition: 0.3s; }
        header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; text-align: center; padding: 50px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .lang-switch { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); color: white; border: 1.5px solid white; padding: 8px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .lang-switch:hover { background: white; color: var(--primary); }
        [dir="ltr"] .lang-switch { left: auto; right: 20px; }

        .container { max-width: 1100px; margin: -30px auto 50px; padding: 0 20px; }
        
        /* Filters Section */
        .filter-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .filter-group { display: flex; flex-direction: column; gap: 10px; }
        label { font-weight: 600; font-size: 0.9em; color: #636e72; }
        select, input { padding: 14px; border: 2px solid #edf2f7; border-radius: 12px; font-size: 1em; outline: none; transition: 0.3s; }
        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1); }

        /* Places Grid */
        #places-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-top: 40px; }
        .place-card { background: white; border-radius: 20px; padding: 25px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #f0f0f0; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .place-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-color: var(--primary); }
        
        .booking-badge { align-self: flex-start; font-size: 0.75em; padding: 4px 12px; border-radius: 8px; background: #f1f2f6; color: #57606f; margin-bottom: 15px; font-weight: bold; }
        .place-name { font-size: 1.3em; font-weight: 800; color: #2d3436; margin-bottom: 10px; }
        .details-row { font-size: 0.9em; color: #636e72; line-height: 1.6; }
        
        .status-msg { margin-top: auto; padding: 12px; border-radius: 12px; font-size: 0.85em; text-align: center; font-weight: bold; margin-top: 20px; }
        .msg-ok { background: #e8faf0; color: #20bf6b; }
        .msg-warn { background: #fff5f5; color: #eb4d4b; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 100px 20px; color: #b2bec3; }
    </style>
</head>
<body>

<header>
    <button class="lang-switch" onclick="toggleLanguage()" id="lang-btn">English</button>
    <h1 id="main-title">Jordan Spots</h1>
    <p id="sub-title"></p>
</header>

<div class="container">
    <div class="filter-card">
        <div class="filter-group">
            <label id="lbl-cat"></label>
            <select id="category" onchange="renderPlaces()"></select>
        </div>
        <div class="filter-group">
            <label id="lbl-budget"></label>
            <input type="number" id="budget" oninput="renderPlaces()">
        </div>
        <div class="filter-group">
            <label id="lbl-people"></label>
            <input type="number" id="people" value="1" min="1" oninput="renderPlaces()">
        </div>
    </div>

    <div id="places-container"></div>
</div>

<script>
// --- 1. إعدادات الترجمة ---
const translations = {
    ar: { 
        title: "اكتشف الأردن 🇯🇴", subTitle: "دليلك الشامل لـ 110 موقع سياحي وتعليمي",
        lblCat: "الفئة:", lblBudget: "ميزانيتك الكلية (JD):", lblPeople: "عدد الأشخاص:",
        placeholderBudget: "مثال: 50", empty: "الرجاء اختيار فئة للبدء في الاستكشاف...",
        warnBudget: "⚠️ الميزانية غير كافية، تحتاج لـ: ", ok: "✅ ميزانيتك كافية لهذا الخيار.",
        perPerson: "للشخص", bookingYes: "متاح للحجز", bookingNo: "دخول عام",
        categories: { "": "-- اختر الفئة --", university: "🎓 الجامعات", restaurant: "🍽️ المطاعم", mall: "🛍️ المولات", cafe: "☕ الكافيهات", heritage: "🏛️ معالم أثرية", pharmacy: "💊 الصيدليات" }
    },
    en: { 
        title: "Explore Jordan 🇯🇴", subTitle: "Your guide to 110 tourist and educational spots",
        lblCat: "Category:", lblBudget: "Total Budget (JD):", lblPeople: "Number of People:",
        placeholderBudget: "Example: 50", empty: "Please select a category to start exploring...",
        warnBudget: "⚠️ Budget low, you need: ", ok: "✅ Budget is sufficient.",
        perPerson: "per person", bookingYes: "Bookable", bookingNo: "Public Access",
        categories: { "": "-- Select Category --", university: "🎓 Universities", restaurant: "🍽️ Restaurants", mall: "🛍️ Malls", cafe: "☕ Cafes", heritage: "🏛️ Heritage", pharmacy: "💊 Pharmacies" }
    }
};

// --- 2. مصفوفة البيانات (عينة توضح الـ 110 مكان) ---
const places = [
    {n_ar:"الجامعة الأردنية", n_en:"University of Jordan", cat:"university", cost:0, loc_ar:"الجبيهة", loc_en:"Jubeiha", rate:4.5, canBook: true},
    {n_ar:"مطعم فخر الدين", n_en:"Fakhreldin", cat:"restaurant", cost:25, loc_ar:"جبل عمان", loc_en:"Jabal Amman", rate:4.8, canBook: true},
    {n_ar:"سيتي مول", n_en:"City Mall", cat:"mall", cost:0, loc_ar:"شارع مكة", loc_en:"Mecca St", rate:4.4, canBook: false},
    {n_ar:"صيدلية فارمسي ون", n_en:"Pharmacy One", cat:"pharmacy", cost:0, loc_ar:"مواقع متعددة", loc_en:"Various Locations", rate:4.6, canBook: false},
    {n_ar:"القلعة", n_en:"Amman Citadel", cat:"heritage", cost:3, loc_ar:"جبل القلعة", loc_en:"Citadel Hill", rate:4.7, canBook: false},
    // ملاحظة: يمكنك إضافة الـ 110 مكان هنا بنفس هذا التنسيق
];

let currentLang = 'ar';

function toggleLanguage() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    updateUI();
}

function updateUI() {
    const t = translations[currentLang];
    document.getElementById('html-tag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('lang-btn').textContent = currentLang === 'ar' ? 'English' : 'عربي';
    document.getElementById('main-title').textContent = t.title;
    document.getElementById('sub-title').textContent = t.subTitle;
    document.getElementById('lbl-cat').textContent = t.lblCat;
    document.getElementById('lbl-budget').textContent = t.lblBudget;
    document.getElementById('lbl-people').textContent = t.lblPeople;
    document.getElementById('budget').placeholder = t.placeholderBudget;
    
    // تحديث خيارات الفئات
    const catSelect = document.getElementById('category');
    const currentVal = catSelect.value;
    catSelect.innerHTML = "";
    for (let key in t.categories) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = t.categories[key];
        catSelect.appendChild(opt);
    }
    catSelect.value = currentVal;
    renderPlaces();
}

function renderPlaces() {
    const cat = document.getElementById('category').value;
    const bud = parseFloat(document.getElementById('budget').value) || Infinity;
    const peo = parseInt(document.getElementById('people').value) || 1;
    const container = document.getElementById('places-container');
    const t = translations[currentLang];

    if (!cat) {
        container.innerHTML = `<div class="empty-state"><h3>${t.empty}</h3></div>`;
        return;
    }

    const filtered = places.filter(p => p.cat === cat);
    container.innerHTML = "";

    filtered.forEach(p => {
        const totalCost = p.cost * peo;
        const isEnough = bud >= totalCost;

        const card = document.createElement('div');
        card.className = "place-card";
        card.innerHTML = `
            <div class="booking-badge">${p.canBook ? t.bookingYes : t.bookingNo}</div>
            <div class="place-name">${currentLang === 'ar' ? p.n_ar : p.n_en}</div>
            <div class="details-row">
                📍 ${currentLang === 'ar' ? p.loc_ar : p.loc_en} <br>
                ⭐ ${p.rate} | 💰 ${p.cost} JD ${t.perPerson}
            </div>
            <div class="status-msg ${isEnough ? 'msg-ok' : 'msg-warn'}">
                ${isEnough ? t.ok : t.warnBudget + totalCost + ' JD'}
            </div>
        `;
        
        card.onclick = () => {
            // حفظ البيانات لإرسالها لصفحة الديتيلز
            const selectedData = { ...p, currentLang, userBudget: bud, userPeople: peo, totalNeeded: totalCost };
            localStorage.setItem('selectedPlace', JSON.stringify(selectedData));
            window.location.href = "details.html";
        };
        
        container.appendChild(card);
    });
}

// تشغيل الواجهة لأول مرة
updateUI();
</script>

</body>
</html>
