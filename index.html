<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Spots | Discover Jordan</title>
    <style>
        :root { --primary: #667eea; --secondary: #764ba2; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg); color: #333; transition: 0.3s; }
        header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 25px; text-align: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .lang-btn { position: absolute; top: 25px; left: 20px; background: white; color: var(--primary); border: none; padding: 8px 18px; border-radius: 25px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.4s; border: 1px solid #eee; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.12); }
        .card-body { padding: 25px; text-align: center; flex-grow: 1; }
        .card-title { font-size: 1.5em; color: var(--secondary); margin-bottom: 10px; }
        .card-loc { color: #777; font-size: 0.95em; margin-bottom: 20px; min-height: 40px; }
        .btn-view { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 12px 25px; border-radius: 12px; text-decoration: none; font-weight: bold; display: inline-block; width: 80%; transition: 0.3s; border: none; cursor: pointer; }
        .btn-view:hover { opacity: 0.9; box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
    </style>
</head>
<body>

<header>
    <button class="lang-btn" onclick="toggleLang()" id="lang-btn">English</button>
    <h1 id="main-title">استكشف أجمل المواقع في الأردن</h1>
</header>

<div class="container">
    <div class="grid" id="places-grid">
        <!-- يتم توليد الأماكن هنا -->
    </div>
</div>

<script>
    // بيانات المواقع - إضافة فئة (canBook) للتحكم في ظهور صفحة الحجز
    const places = [
        {
            id: 1,
            n_ar: "حدائق الحسين", n_en: "Al Hussein Parks",
            loc_ar: "عمان - المدينة الطبية", loc_en: "Amman - Medical City",
            totalCost: 0,
            canBook: false // مكان عام لا يحتاج حجز
        },
        {
            id: 2,
            n_ar: "سيتي مول", n_en: "City Mall",
            loc_ar: "عمان - شارع المدينة الطبية", loc_en: "Amman - Medical City St",
            totalCost: 0,
            canBook: false // مول لا يحتاج حجز
        },
        {
            id: 3,
            n_ar: "مطعم زوادة", n_en: "Zwadeh Restaurant",
            loc_ar: "الفحيص", loc_en: "Fuheis",
            totalCost: 20,
            canBook: true // مطعم يحتاج حجز
        },
        {
            id: 4,
            n_ar: "مقهى ومطعم إطلالة", n_en: "Panorama Cafe",
            loc_ar: "وسط البلد - جبل القلعة", loc_en: "Downtown - Citadel Hill",
            totalCost: 15,
            canBook: true // مقهى يحتاج حجز
        }
    ];

    let currentLang = 'ar';

    const translations = {
        ar: {
            title: "استكشف أجمل المواقع في الأردن",
            btnView: "عرض التفاصيل",
            langBtn: "English",
            dir: "rtl"
        },
        en: {
            title: "Explore the Best Spots in Jordan",
            btnView: "View Details",
            langBtn: "عربي",
            dir: "ltr"
        }
    };

    function renderPlaces() {
        const grid = document.getElementById('places-grid');
        grid.innerHTML = '';
        const t = translations[currentLang];

        places.forEach(place => {
            const name = currentLang === 'ar' ? place.n_ar : place.n_en;
            const loc = currentLang === 'ar' ? place.loc_ar : place.loc_en;

            grid.innerHTML += `
                <div class="card" onclick="goToDetails(${place.id})">
                    <div class="card-body">
                        <h3 class="card-title">${name}</h3>
                        <p class="card-loc">📍 ${loc}</p>
                        <button class="btn-view">${t.btnView}</button>
                    </div>
                </div>
            `;
        });
    }

    function toggleLang() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const t = translations[currentLang];
        
        document.getElementById('html-tag').dir = t.dir;
        document.getElementById('html-tag').lang = currentLang;
        document.getElementById('lang-btn').textContent = t.langBtn;
        document.getElementById('main-title').textContent = t.title;
        
        renderPlaces();
    }

    function goToDetails(id) {
        const selected = places.find(p => p.id === id);
        // تخزين البيانات كاملة بما في ذلك حالة الحجز canBook
        localStorage.setItem('selectedPlace', JSON.stringify({
            ...selected,
            currentLang: currentLang
        }));
        window.location.href = "details.html";
    }

    // التشغيل عند تحميل الصفحة
    renderPlaces();
</script>

</body>
</html>
