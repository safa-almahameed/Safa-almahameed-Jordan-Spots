<!DOCTYPE html>

<html lang="ar" id="html-tag">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title></title>

<style>

body{font-family:Arial;margin:0;background:#f2f2f2;padding:20px;text-align:center;}

.card{

background:white;

padding:20px;

border-radius:15px;

max-width:500px;

margin:auto;

}

input{

width:90%;

padding:10px;

margin:10px 0;

border-radius:8px;

border:1px solid #ccc;

}

button{

width:95%;

padding:12px;

border:none;

border-radius:10px;

margin-top:10px;

cursor:pointer;

}

.btn{background:#667eea;color:white;}

.back{background:#ddd;}

.star{

font-size:25px;

cursor:pointer;

color:#ccc;

}

.star.active{color:gold;}

.toast{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

background:#333;

color:white;

padding:10px 20px;

border-radius:10px;

display:none;

}

</style>

</head>

<body>

<div class="card">

<h2 id="name"></h2>

<p><b id="loc-label"></b> <span id="loc"></span></p>

<p><b id="cost-label"></b> <span id="cost"></span></p>

<div id="rating">

<span class="star" onclick="rate(1)">★</span>

<span class="star" onclick="rate(2)">★</span>

<span class="star" onclick="rate(3)">★</span>

<span class="star" onclick="rate(4)">★</span>

<span class="star" onclick="rate(5)">★</span>

</div>

<br>

<div id="booking">

<input id="user">

<input id="date" type="date">

<button class="btn" onclick="book()" id="book-btn"></button>

</div>

<button class="back" onclick="back()" id="back-btn"></button>

</div>

<div id="toast" class="toast"></div>

<script>

let data=null;

try{

const raw=localStorage.getItem("selectedPlace");

data=raw?JSON.parse(raw):null;

}catch(e){

window.location.href="index.html";

}

const t={

ar:{

loc:"📍 الموقع:",

cost:"💰 السعر:",

book:"تأكيد الحجز",

back:"رجوع",

alert:"تم الحجز في ",

rating:"التقييم: "

},

en:{

loc:"📍 Location:",

cost:"💰 Cost:",

book:"Confirm Booking",

back:"Back",

alert:"Booked at ",

rating:"Rating: "

}

};

function toast(msg){

const t=document.getElementById("toast");

t.textContent=msg;

t.style.display="block";

setTimeout(()=>t.style.display="none",2000);

}

function init(){

if(!data){

window.location.href="index.html";

return;

}

const lang=data.currentLang||"ar";

const tr=t[lang];

document.getElementById("html-tag").dir=lang==="ar"?"rtl":"ltr";

document.title=lang==="ar"?data.n_ar:data.n_en;

document.getElementById("name").textContent=

lang==="ar"?data.n_ar:data.n_en;

document.getElementById("loc").textContent=

lang==="ar"?data.loc_ar:data.loc_en;

document.getElementById("cost").textContent=data.totalCost+" JOD";

document.getElementById("loc-label").textContent=tr.loc;

document.getElementById("cost-label").textContent=tr.cost;

document.getElementById("book-btn").textContent=tr.book;

document.getElementById("back-btn").textContent=tr.back;

document.getElementById("user").placeholder=lang==="ar"?"اسمك":"Your name";

}

function rate(n){

const stars=document.querySelectorAll(".star");

stars.forEach((s,i)=>{

s.classList.toggle("active",i<n);

});

const lang=data.currentLang||"ar";

toast(t[lang].rating+n);

}

function book(){

const lang=data.currentLang||"ar";

const tr=t[lang];

const user=document.getElementById("user").value;

const date=document.getElementById("date").value;

if(!user||!date){

alert("Fill all fields");

return;

}

toast(tr.alert+(lang==="ar"?data.n_ar:data.n_en));

localStorage.removeItem("selectedPlace");

window.location.href="index.html";

}

function back(){

window.location.href="index.html";

}

init();

</script>

</body>

</html>
